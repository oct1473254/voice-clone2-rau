name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # System libraries the audio + Qt extras link against. PySide6 runs
      # headless via the offscreen platform, but still needs the xcb/EGL libs
      # present; soundfile needs libsndfile1, sounddevice needs libportaudio2.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsndfile1 \
            libportaudio2 \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Install package (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[core,providers,audio,gui,dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  # macOS smoke run is intentionally NOT automated: microphone (TCC) permission
  # and CoreAudio devices aren't available on hosted runners. Run it manually
  # before a show with `hamlet-ai doctor` and a real 5-second clone.
